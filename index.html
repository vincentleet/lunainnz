<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: sticky top bar + single reading column; hash-routed views (overview, six day pages, bookings, ideas, travel) */
:root{
  --bg:#f5f3fb; --surface:#ffffff; --sunk:#ece8f6; --line:#dcd5ec;
  --ink:#1b1730; --muted:#615a7c;
  --accent:#5b3cc4;       /* twilight violet */
  --accent-ink:#ffffff;
  --ochre:#a8740a;        /* starlight gold */
  --ochre-soft:#f6edd5;
  --ok:#22764a; --ok-soft:#dcefe4;
  --warn:#a3305e; --warn-soft:#f7e0ea;
  --red:#b3261e; --orange:#c25e0c; --yellow:#9a7a00; --green:#2f7d3c;
  --star:rgba(91,60,196,.18);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0b1a; --surface:#16132a; --sunk:#1f1a38; --line:#2e2750;
  --ink:#ebe7f8; --muted:#a39cc2;
  --accent:#b19cff; --accent-ink:#150f2e;
  --ochre:#e9c76b; --ochre-soft:#332a17;
  --ok:#7fd8a0; --ok-soft:#16302a;
  --warn:#f5a6c0; --warn-soft:#3a1e2e;
  --red:#ff8fa3; --orange:#ffb877; --yellow:#e9c76b; --green:#7fd8a0;
  --star:rgba(255,255,255,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0b1a; --surface:#16132a; --sunk:#1f1a38; --line:#2e2750;
  --ink:#ebe7f8; --muted:#a39cc2;
  --accent:#b19cff; --accent-ink:#150f2e;
  --ochre:#e9c76b; --ochre-soft:#332a17;
  --ok:#7fd8a0; --ok-soft:#16302a;
  --warn:#f5a6c0; --warn-soft:#3a1e2e;
  --red:#ff8fa3; --orange:#ffb877; --yellow:#e9c76b; --green:#7fd8a0;
  --star:rgba(255,255,255,.55);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(1.2px 1.2px at 12% 18%,var(--star) 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,var(--star) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 42% 64%,var(--star) 50%,transparent 51%),radial-gradient(1px 1px at 88% 52%,var(--star) 50%,transparent 51%),radial-gradient(1.2px 1.2px at 23% 86%,var(--star) 50%,transparent 51%),radial-gradient(1px 1px at 63% 33%,var(--star) 50%,transparent 51%);background-size:420px 420px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
.brand{display:inline-flex;align-items:center;gap:6px}
.brand .moon{width:18px;height:18px;color:var(--ochre)}
nav.main{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a,.theme button{font:600 14px/1 var(--body);color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:6px;white-space:nowrap;border:0;background:none;cursor:pointer}
nav.main a:hover,.theme button:hover{color:var(--ink);background:var(--sunk)}
nav.main a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.theme{display:flex;border:1px solid var(--line);border-radius:7px;padding:2px}
.theme button{padding:6px 8px;font-size:12px}
.theme button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:28px 64px}
.eyebrow{font:600 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.lede{color:var(--muted);font-size:17px;max-width:62ch}
section+section{margin-top:36px}
h2{font-size:22px;margin-bottom:12px}

/* overview hero */
.hero h1{font-size:clamp(34px,7vw,54px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:20px}
.facts div{background:var(--surface);padding:12px 14px}
.facts b{display:block;font:700 22px/1.1 var(--display)}
.facts small{color:var(--muted);font-size:13px}

/* route strip */
.route{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stop{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.stop:hover{border-color:var(--accent)}
.stop .d{font:600 12px/1 var(--mono);color:var(--muted)}
.stop .t{font:700 15px/1.2 var(--display)}
.stop .p{font-size:12px;color:var(--accent);font-weight:600;margin-top:auto}
.stop.solo .p{color:var(--ochre)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* generic list rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;padding:12px 14px;align-items:baseline}
.row+.row{border-top:1px solid var(--line)}
.row .k{font:600 13px/1.3 var(--mono);color:var(--muted)}
.row .v{min-width:0}
.row .v small{display:block;color:var(--muted);font-size:14px}

.badge{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--body);padding:5px 8px;border-radius:999px;white-space:nowrap}
.b-booked{background:var(--ok-soft);color:var(--ok)}
.b-book{background:var(--warn-soft);color:var(--warn)}
.b-free{background:var(--sunk);color:var(--muted)}
.b-opt{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.b-day{background:var(--ochre-soft);color:var(--ochre)}

.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.note h3{font-size:16px;margin-bottom:4px}
.note p{margin:0;color:var(--muted);font-size:15px}
.note.calm{background:var(--sunk);border-color:transparent;grid-column:1/-1}
.note.calm h3{color:var(--accent)}

/* day page */
.dayhead .meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;color:var(--muted);font-size:15px}
.dayhead h1{font-size:clamp(28px,5.5vw,40px);font-weight:800;letter-spacing:-.01em;margin-top:6px}
.mode{font-weight:700}
.mode.car{color:var(--accent)} .mode.solo{color:var(--ochre)}
.flex{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--ochre-soft);color:var(--ink);font-size:15px}
.flex b{color:var(--ochre)}
.part{margin-top:28px}
.part>h2{font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.part>h2::after{content:"";height:1px;background:var(--line);flex:1}
.card{display:grid;grid-template-columns:64px 1fr;gap:4px 14px;padding:16px 0}
.card+.card{border-top:1px dashed var(--line)}
.card .time{font:600 15px/1.4 var(--mono);color:var(--accent)}
.card.opt .time{color:var(--muted)}
.card .body{min-width:0}
.card h3{font-size:18px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card .dur{font:500 13px/1 var(--mono);color:var(--muted)}
.card p{margin:6px 0 0;color:var(--ink)}
.fields{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:14.5px}
.fields dt{font:600 12px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fields dd{margin:0;min-width:0}
.map{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:600 13px/1 var(--body);text-decoration:none;padding:7px 10px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.map:hover{background:var(--line)}
.map svg{width:14px;height:14px}
.eur{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-weight:600}

/* bookings */
.progress{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
.progress .track{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress .fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.progress b{font:600 14px/1 var(--mono);white-space:nowrap}
.tier{margin-top:22px}
.tier h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tier h3 i{width:10px;height:10px;border-radius:50%}
.check{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:12px 14px;align-items:start;cursor:pointer}
.check+.check{border-top:1px solid var(--line)}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.check .v small{display:block;color:var(--muted);font-size:14px}
.check.done .v>span{text-decoration:line-through;color:var(--muted)}

/* ideas */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
.filters button{font:600 13px/1 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.idea .tags{display:flex;gap:6px;flex-wrap:wrap}
.idea h3{font-size:17px}
.idea p{margin:0;font-size:15px;color:var(--muted)}
.idea .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding-top:6px}

table{border-collapse:collapse;width:100%;font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:14px}

@media (max-width:720px){
  .bar{position:static}
  .theme{margin-left:auto}
  nav.main{order:3;flex-basis:100%}
  nav.main a{padding:7px 9px}
  .route{grid-template-columns:repeat(3,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .notes,.ideas{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto}
  .row .k{grid-column:1/-1}
  .brand{font-size:16px}
}
@media (max-width:420px){.route{grid-template-columns:repeat(2,1fr)} .card{grid-template-columns:52px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- RENDER ---------- */
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const NAV = [['overview','Overview'], ...DAYS.map(d=>[`day-${d.n}`,`Day ${d.n}`]), ['bookings','Bookings'], ['ideas','Ideas'], ['travel','Flights & stays']];
nav.innerHTML = NAV.map(([id,l])=>`<a href="#${id}" data-v="${id}">${l}</a>`).join('');

function planned(){
  let t=0; DAYS.forEach(d=>Object.values(d.parts).flat().forEach(c=>{ if(c.cost && !c.opt) t += (c.cost[1]||c.cost[0]); }));
  return t;
}

function overview(){
  const total = planned();
  return `
  <section class="hero">
    <div class="eyebrow">Wed 2 to Mon 7 December 2026</div>
    <h1>Luna in New Zealand</h1>
    <p class="lede">Pick-up in Auckland, four nights in Rotorua for geysers, forests, Māori culture, Hobbiton and a day out on the Bay of Plenty coast, then a night in Auckland before the flight to LA.</p>
    <div class="facts">
      <div><b>5</b><small>nights</small></div>
      <div><b>4 + 1</b><small>Rotorua, Auckland</small></div>
      <div><b>~900 km</b><small>driving, all with Vincent</small></div>
      <div><b class="num">~NZ$${total}</b><small>planned activities, per person (~€${eur(total)})</small></div>
    </div>
  </section>

  <section>
    <h2>The route</h2>
    <div class="route">${DAYS.map(d=>`
      <a class="stop ${d.mode==='solo'?'solo':''}" href="#day-${d.n}">
        <span class="d">Day ${d.n} · ${d.date}</span>
        <span class="t">${d.short}</span>
        <span class="p">${d.base.replace(/ \(.*\)/,'')}</span>
      </a>`).join('')}
    </div>
    <div class="legend"><span><i style="background:var(--accent)"></i>With Vincent, by car</span><span><i style="background:var(--ochre)"></i>Solo in Auckland</span></div>
  </section>

  <section>
    <h2>Flights</h2>
    <div class="rows">
      <div class="row"><span class="k">Wed 2 Dec</span><span class="v"><b>QF143</b> Sydney 08:55 → Auckland 14:05<small>Qantas · 3h 10m</small></span>${badge('booked')}</div>
      <div class="row"><span class="k">Mon 7 Dec</span><span class="v"><b>AA82</b> Auckland 15:50 → Los Angeles 07:10<small>American Airlines · lands the same Monday</small></span>${badge('booked')}</div>
    </div>
  </section>

  <section>
    <h2>Book first</h2>
    <div class="rows">
      <div class="row"><span class="k">Before travel</span><span class="v">NZeTA and visitor levy<small>Needed before boarding in Sydney</small></span>${badge('booked')}</div>
      <div class="row"><span class="k">2 to 7 Dec</span><span class="v">Rotorua (4 nights) and Auckland (1 night)<small>Accommodation sorted</small></span>${badge('booked')}</div>
      <div class="row"><span class="k">Thu 3 Dec</span><span class="v">Hobbiton, 4:00pm tour<small>Check in by 3:40pm</small></span>${badge('booked')}</div>
    </div>
    <p style="margin-top:10px"><a href="#bookings">Full booking checklist →</a></p>
  </section>

  <section>
    <h2>Good to know</h2>
    <div class="notes">
      <div class="note calm"><h3>No snakes. Anywhere.</h3><p>New Zealand has no snakes at all and nothing dangerous in the bush. The only venomous spider, the katipō, is rare and shy and hides under driftwood in coastal dune grass. Bites hardly ever happen. On the beach at Ōhope, stick to the open sand and paths and don't dig under logs. Forest walks here are just forest walks.</p></div>
      <div class="note"><h3>Weather</h3><p>Early summer. Expect low to mid 20s °C by day, cooler nights in Rotorua, and the odd shower. Bring a light jacket.</p></div>
      <div class="note"><h3>Sun</h3><p>The UV is much stronger than Europe, even when it's cloudy. Sunscreen and sunglasses every day.</p></div>
      <div class="note"><h3>Money</h3><p>Cards and phone payments work everywhere, including Auckland buses. No tipping expected. Prices here use NZ$1 ≈ €0.50.</p></div>

      <div class="note"><h3>Rotorua smell</h3><p>The whole town smells faintly of sulphur. It's the geothermal activity, it's harmless, and you'll stop noticing.</p></div>
      <div class="note"><h3>Pack</h3><p>Comfortable walking shoes, a day bag, sunscreen.</p></div>
    </div>
  </section>`;
}

function card(c){
  const cost = c.cost ? `<dt>Cost</dt><dd>${c.cost[1] ? `NZ$${c.cost[0]} to ${c.cost[1]} <span class="eur">(~€${eur(c.cost[0])} to ${eur(c.cost[1])})</span>` : money(c.cost[0])}${c.cost[2]?` · ${c.cost[2]}`:''}</dd>` : '';
  const f = c.f ? Object.entries(c.f).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('') : '';
  return `<article class="card ${c.opt?'opt':''}">
    <div class="time">${c.t}</div>
    <div class="body">
      <h3>${c.h} ${badge(c.s)}</h3>
      ${c.dur?`<div class="dur">${c.dur}</div>`:''}
      ${c.p?`<p>${c.p}</p>`:''}
      ${(cost||f)?`<dl class="fields">${cost}${f}</dl>`:''}
    </div>
  </article>`;
}

function day(d){
  const prev = d.n>1 ? `<a href="#day-${d.n-1}">← Day ${d.n-1}</a>` : `<a href="#overview">← Overview</a>`;
  const next = d.n<DAYS.length ? `<a href="#day-${d.n+1}">Day ${d.n+1} →</a>` : `<a href="#bookings">Bookings →</a>`;
  return `
  <section class="dayhead">
    <div class="eyebrow">Day ${d.n} · ${d.date}</div>
    <h1>${d.title}</h1>
    <div class="meta"><span>Tonight: <b>${d.base}</b></span><span class="mode ${d.mode}">${d.mode==='car'?'With Vincent, by car':'Solo, on foot and transit'}</span></div>
    ${d.flex?`<div class="flex">${d.flex}</div>`:''}
  </section>
  ${Object.entries(d.parts).map(([k,cards])=>`<section class="part"><h2>${k}</h2>${cards.map(c=>card(c)).join('')}</section>`).join('')}
  <div class="pager">${prev}<a href="#overview">Overview</a>${next}</div>`;
}

let done = {};
try{ done = JSON.parse(localStorage.getItem('luna-nz-bookings')||'{}'); }catch(e){}
BOOK.forEach(t=>t.items.forEach(it=>{ if(it[3] && done[it[0]]===undefined) done[it[0]]=true; }));
function bookings(){
  return `
  <section>
    <div class="eyebrow">Checklist</div>
    <h1 style="font-size:34px;margin:6px 0 4px">Bookings</h1>
    <p class="lede">Ordered by urgency. Ticks are saved in this browser only.</p>
    <div class="progress"><div class="track"><div class="fill" id="fill"></div></div><b id="count"></b></div>
    ${BOOK.map(t=>`<div class="tier"><h3><i style="background:var(${t.c})"></i>${t.tier}</h3><div class="rows">
      ${t.items.map(([id,l,s])=>`<label class="check ${done[id]?'done':''}" for="bk-${id}"><input type="checkbox" id="bk-${id}" data-id="${id}" ${done[id]?'checked':''}><span class="v"><span>${l}</span><small>${s}</small></span></label>`).join('')}
    </div></div>`).join('')}
  </section>`;
}
function updateCount(){
  const all = BOOK.flatMap(t=>t.items).length;
  const n = BOOK.flatMap(t=>t.items).filter(it=>done[it[0]]).length;
  const c = document.getElementById('count'), f = document.getElementById('fill');
  if(c){ c.textContent = `${n} / ${all} done`; f.style.width = `${(n/all)*100}%`; }
}

let ideaFilter = 'All';
function ideas(){
  const tags = ['All', ...new Set(IDEAS.flatMap(i=>i.tags))];
  const list = IDEAS.filter(i=>ideaFilter==='All'||i.tags.includes(ideaFilter));
  return `
  <section>
    <div class="eyebrow">Spare time and swaps</div>
    <h1 style="font-size:34px;margin:6px 0 4px">Extra ideas</h1>
    <p class="lede">For the flex day, a rainy afternoon, or if something on the plan doesn't appeal.</p>
    <div class="filters" role="group" aria-label="Filter ideas">${tags.map(t=>`<button type="button" data-f="${t}" aria-pressed="${t===ideaFilter}">${t}</button>`).join('')}</div>
    <div class="ideas">${list.map(i=>`
      <article class="idea">
        <div class="tags">${i.tags.map(t=>`<span class="badge ${t==='Free'?'b-booked':'b-free'}">${t}</span>`).join('')}</div>
        <h3>${i.h}</h3>
        <p>${i.p}</p>
        ${i.cost?`<div class="foot"><span class="eur">${i.cost}</span></div>`:''}
      </article>`).join('')}</div>
  </section>`;
}

  <section>

        <tr><td>Wed 2 Dec</td><td class="mono">QF143</td><td>Sydney T1 → Auckland Intl</td><td class="num">08:55 → 14:05</td></tr>

      </tbody>

  <section>
    <h2>Where you're staying</h2>

      <div class="row"><span class="k">2 to 6 Dec</span><span class="v"><b>Rotorua</b> · 4 nights<small>Booked.</small></span>${badge('booked')}</div>

        <tr><td>Thu 3</td><td>Rotorua → Geothermal → Hobbiton → Rotorua</td><td class="num">~3 hrs total</td></tr>
        <tr><td>Sat 5</td><td>Rotorua → Whakatāne / Ōhope, via Okere Falls</td><td class="num">~1 hr 15 min each way</td></tr>
        <tr><td>Sun 6</td><td>Rotorua → Blue Spring, Putaruru</td><td class="num">~1 hr</td></tr>
        <tr><td>Sun 6</td><td>Putaruru → Matamata</td><td class="num">~30 min</td></tr>

      </tbody>
    </table></div>

function render(){
  const v = (location.hash||'#overview').slice(1);
  let html;
  const m = v.match(/^day-(\d)$/);
  if(m && DAYS[m[1]-1]) html = day(DAYS[m[1]-1]);
  else if(v==='bookings') html = bookings();
  else if(v==='ideas') html = ideas();
  else if(v==='travel') html = travel();
  else html = overview();
  app.innerHTML = html;
  nav.querySelectorAll('a').forEach(a=>{
    const on = a.dataset.v===v || (!NAV.some(n=>n[0]===v) && a.dataset.v==='overview');
    if(on){ a.setAttribute('aria-current','page'); a.scrollIntoView({block:'nearest',inline:'nearest'}); } else a.removeAttribute('aria-current');
  });
  updateCount();
}
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });

app.addEventListener('change',e=>{
  const id = e.target.dataset && e.target.dataset.id; if(!id) return;
  done[id] = e.target.checked;
  e.target.closest('.check').classList.toggle('done', e.target.checked);
  try{ localStorage.setItem('luna-nz-bookings', JSON.stringify(done)); }catch(err){}
  updateCount();
});
app.addEventListener('click',e=>{
  const b = e.target.closest('[data-f]'); if(!b) return;
  ideaFilter = b.dataset.f; render();
});

/* theme */
const root = document.documentElement;
function setTheme(t){
  if(t==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t);
  document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===t));
  try{ localStorage.setItem('luna-nz-theme',t); }catch(e){}
}
let saved='auto'; try{ saved = localStorage.getItem('luna-nz-theme')||'auto'; }catch(e){}
setTheme(saved);
document.querySelectorAll('.theme button').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));

render();
})();
